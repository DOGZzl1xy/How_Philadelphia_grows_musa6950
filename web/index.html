<body>
  <main id="app">
    <section id="stage" aria-hidden="true">
      <div id="frame">
        <img id="photo-a" alt="" decoding="async" />
        <img id="photo-b" alt="" decoding="async" />
        <canvas id="height"></canvas>
        <svg id="outlines" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid slice"></svg>
        <svg id="grid" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid slice"></svg>
        <div id="stack"></div>
        <div id="chart"></div>
        <canvas id="zoom"></canvas>
        <div id="year"></div>
      </div>
    </section>
    <section id="text" aria-live="polite"></section>
    <nav id="progress" aria-label="Progress"></nav>
    <a id="to-explore" class="btn" href="/explore" aria-label="Explore the data"></a>
    <p id="credit">Aerial photography: City of Philadelphia. LiDAR: PASDA / City of Philadelphia.</p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
